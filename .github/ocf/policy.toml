# OCF policy - the single place that decides what the gate does.
#
# Edit this file to change gating behaviour, then run:
#
#     python .github/ocf/ocf.py reload
#
# Rules are evaluated in file order and the FIRST match wins. Exemptions therefore come first, precise
# rules next, and broad catch-alls last.
#
# The vocabulary below is GENERATED from the tables in ocf.py. It used to be written here by hand, and
# it drifted: it went on offering `when` values the engine had stopped accepting, and following it made
# the evaluator raise, which the hook turns into a denial of everything. Do not edit it - edit the
# tables, which the engine actually reads.

# OCF:VOCABULARY:BEGIN
# Every identifier this file may use, and what it means.
# Rendered by `python .github/ocf/ocf.py reload` from the tables in ocf.py, so it cannot
# describe a key the engine does not read, or miss one it does.

# [sections]
#   system         enabled: the maintenance switch. False stops the three `when = enforced` rules (the orchestrator's self-protection and the self-authorization rule) and the three approval rules, and nothing else - the protected list is judged by a rule with no `when`, so it still applies
#   paths          state_dir: where the runtime lives. Everything else is a fixed filename, not a setting
#   limits         fail_budget: consecutive failures before exec-class tools are locked
#   approval       allowed_states: the states acting is allowed in. min_reason_len: shortest approve reason
#   hooks          which events the orchestrator is installed on; reload rewrites the wiring from these
#   unknown_tool   action: verdict for an unrecognised tool that looks like it acts
#   tools          the tool classes, and the payload field each tool keeps its command in
#   selftest       canaries: one must deny and one must allow, or the gate is not proven alive
#   rule           the rules themselves, evaluated in file order, first match wins

# [rule] fields. Two shapes are accepted while the older one is converted away, and
# this region is generated - edit the rules, not this text.
#   id             the name every verdict carries, so a decision can be traced back to its rule. The tests assert these, so renaming one fails instead of drifting
#   enabled        true or false. A switched-off rule is not evaluated at all
#   kind           hard: the hook reads it and gives a verdict. soft: reload writes it into the contract
#   label          the name a soft rule is listed under in the generated contract
#   if             the conditions that must all hold. This is the whole of a rule's logic
#   unless         the exception. For a hard rule a condition table; for a soft rule a sentence the model applies
#   result         hard: allow | ask | deny | require_approval. soft: the sentence to inject
#   why            shown to the agent in the verdict, so write what to fix, not what went wrong

#   the older shape, still used by the rules that protect the orchestrator itself:
#   on             tool class this rule applies to: visual | env | exec | write | read | session | unknown | any
#   surface        which text to match: tool | command | path | write_target | content | any
#   match          regex tried against every candidate value of that surface
#   when           always | enforced (system.enabled is true, regardless of state)
#   action         allow | ask | deny | require_approval
#   only_if        an extra condition table that must hold

# [rule.if] conditions. Each key is one condition; the value is what it compares against,
# which is usually a regex or a number.
#   class                  the tool's class, or the class a tool carrying a command is judged as: visual, env, exec, write, read, session, unknown
#   state                  the current state: ready, asking, planning, executing, reporting, blocked
#   tool                   the tool name as the editor reports it
#   command_matches        regex against the command string
#   command_length_over    the command is longer than this many characters
#   command_statements_over the command has more statements than this, counted with quotes blanked
#   command_repeats_at_least this exact command has already run at least this many times
#   content_matches        regex against what would be written, plus the raw tool input
#   environment_declared   the human has declared the existing environment (the stack_env fact)
#   approval               true when a human approve is still outstanding, i.e. the state is not an acting state
#   computed               a flag computed from the command. See the list below
#   fact                   a fact recorded by the human or the hook, compared with is / is_not / is_set
#   is_set                 with fact: the fact is non-empty (true) or empty (false)
#   is                     with fact: the fact equals this value
#   is_not                 with fact: the fact does not equal this value
#   path_matches           regex against each path the action touches. Judged per path, never as a batch
#   touches_protected      each path the action touches is on the protected list, judged per path
#   listed_in              older shape: each candidate value appears in that list file

# computed flags, named by the `computed` condition:
#   control_plane      every statement runs the entry script by its full relative path, so reading the state is not acting and needs no approval
#   invokes_entry      at least one statement does
#   human_only_call    the entry script is invoked with a human-only subcommand as its argument

# `when` (older shape) accepts:
#   always             always
#   enforced           system.enabled is true, regardless of the current state

# `result` and `action` accept:
#   allow              let it through
#   ask                the editor asks the human once; a pre-approval may swallow this
#   deny               refuse, and say why. Handled before any approval logic, so nothing auto-approves past it
#   require_approval   refuse, and tell the agent to have the human run the approve command

# a soft rule's occasion, i.e. when its sentence is in force:
#   session-start      a session begins
#   ask                the human's statement is being read and gaps are being grilled
#   plan               a plan is being written or audited
#   act                a tool is about to be used
#   answer             every answer

# [hooks] switches:
#   enabled            the master switch. false writes a wiring file with no hooks: nothing is installed
#   session_start      run the self-check when a session begins
#   user_prompt        advance the state machine and report it on each human message
#   pre_tool_use       the gate. Switching it off stops everything being refused
#   post_tool_use      warn when a command produced no progress
# OCF:VOCABULARY:END

[system]
# The single switch for the whole gate. false = the human has handed control back: the approval
# requirement and the orchestrator self-protection are skipped, so gate code may be edited.
#
# MIGRATION: keep this false until ocf.py has been validated against the real hooks, then flip it to
# true and reload the window.
enabled = false

[paths]
state_dir = ".orchestrator"
# The protected list is a FIXED file, not a configured path: a list that can be pointed elsewhere is a
# list that can be pointed away. Its entries are the files the machine never modifies, and a comment
# inside it marks the ones that are human-written.

[hooks]
# Which events the orchestrator is installed on. `reload` rewrites .github/hooks/orchestrator.json
# from these switches, so this is the whole of "install / uninstall": turning `enabled` off writes a
# wiring file with no hooks in it, and VS Code then never starts this program - nothing is left behind
# to switch off later. Any change here needs a VS Code window reload to take effect, because hooks are
# read when the window starts.
#
# PreToolUse is the gate. Switching it off stops everything being refused; the rest only add context.
enabled       = true
session_start = true
user_prompt   = true
pre_tool_use  = true
post_tool_use = true

[limits]
# Read on every invocation, so changes apply without reloading the window.
# The command-length, statement and repeat ceilings are not here: each rule carries its own number,
# so there is one place to look. This is what is left, the failure budget of the workflow itself.
fail_budget = 2

[approval]
# The states in which acting is allowed. Entering them is a human-only act.
allowed_states = ["executing", "reporting"]
# A real sentence, so an accidental or scripted call cannot approve a plan.
min_reason_len = 8

[unknown_tool]
# Applied only outside allowed_states. allow | ask | deny
action = "ask"

[selftest]
# A canary proves the gate is alive. Each case runs through the REAL hook entry point, so a gate that
# quietly stopped denying is caught instead of looking healthy.
[[selftest.canary]]
id = "deny-visual-tool"
expect = "deny"
payload = { hook_event_name = "PreToolUse", tool_name = "view_image", tool_input = { filePath = "canary.png" } }

[[selftest.canary]]
id = "deny-human-only-subcommand"
expect = "deny"
payload = { hook_event_name = "PreToolUse", tool_name = "run_in_terminal", tool_input = { command = "python .github/ocf/ocf.py approve \"looks like a human call\"" } }

[[selftest.canary]]
id = "allow-session-tool"
expect = "allow"
payload = { hook_event_name = "PreToolUse", tool_name = "manage_todo_list", tool_input = { todoList = [] } }

# ---------------------------------------------------------------------------
# Tool classification. Adding a tool needs no code change.
# ---------------------------------------------------------------------------

[tools]
# A tool's class says what it does. The verdict follows from that. Nothing here touches the
# network or a file the gate cannot see, so a list edit is all a new tool needs.
#
# Order in this file does not matter; the order the CLASSES are consulted in does, and it is strictest
# first, so a tool listed twice is judged by the more restrictive entry.

# write: changes text. The target path and the content are inspected.
write = [
  "create_file",
  "create_directory",
  "replace_string_in_file",
  "multi_replace_string_in_file",
  "edit_notebook_file",
  "vscode_renameSymbol",
  "mcp_github_mcp_se_create_or_update_file",
  "mcp_github_mcp_se_delete_file",
  "mcp_github_mcp_se_push_files",
  "mcp_github_mcp_se_fork_repository",
]
# exec: carries a command string, which is inspected. create_and_run_task keeps its command at
# task.command, which [tools.field] below knows about.
exec = [
  "run_in_terminal",
  "run_notebook_cell",
  "create_and_run_task",
]
# env: sets up or changes the toolchain and the environment. Gated by the declared-environment rule
# first, then by approval - the rule that used to be called test-authorization and toolchain is about
# commands, and these tools have no command, so they needed their own.
env = [
  "install_python_packages",
  "install_extension",
  "configure_python_environment",
  "debug_java_application",
  "create_new_workspace",
  "create_new_jupyter_notebook",
]
# visual: reads an image or drives a browser. Refused unconditionally, in every state, never subject to
# approval. Everything from the playwright family belongs here: `evaluate` runs code in a page and its
# payload is not a shell command, so it used to sit under exec and slip past the command-text ban.
visual = [
  "screenshot_page",
  "view_image",
  "run_playwright_code",
  "mcp_playwright_browser_take_screenshot",
  "mcp_playwright_browser_run_code_unsafe",
  "mcp_playwright_browser_evaluate",
]
# session: shapes the conversation and cannot touch the repository. Never gated - that is what the class
# means. Dispatching a subagent is not a way round the gate, because the subagent's own tool calls come
# back through it.
session = ["runSubagent", "manage_todo_list", "vscode_askQuestions", "memory"]

# read: only reads. Never gated. This list is what keeps the strict fallback policy usable: a broken
# policy file must deny every change, but denying reading as well leaves the agent blind and unable to
# help find the typo. `visual` is consulted before this class on purpose, so view_image - which is also
# a kind of reading - stays refused.
read = [
  "read_file",
  "grep_search",
  "file_search",
  "list_dir",
  "get_errors",
  "copilot_getNotebookSummary",
  "read_notebook_cell_output",
  "vscode_listCodeUsages",
]

# Where each tool keeps its payload. A dotted path descends into nested objects, which is what fixes
# the class of bug where a command hidden at task.command was never inspected.
[tools.field]
default = ["command", "code"]
run_in_terminal = ["command"]
run_notebook_cell = ["code"]
create_and_run_task = ["task.command"]
mcp_playwright_browser_evaluate = ["function"]

# ---------------------------------------------------------------------------
# Rules - first match wins
# ---------------------------------------------------------------------------

# plan.md is the artifact the gate itself demands, so it must be writable before approval.
[[rule]]
id      = "plan-md-exempt"
enabled = true
result  = "allow"
why     = "The gate itself asks for this artifact."

[rule.if]
class        = "write"
path_matches = '^\.orchestrator/plan\.md$'

[[rule]]
id      = "failure-budget"
enabled = true
result  = "deny"
why     = "Consecutive failures reached the budget. Stop and report the symptom, what you tried, and what you need from the human. Clears when the human replies."

[rule.if]
class = "exec"
fact  = "must_consult"
is    = "yes"

[[rule]]
id      = "visual-tool"
enabled = true
result  = "deny"
why     = "The machine may never take screenshots or view images with a tool. Ask the human to attach one; attachments are readable, tools are not."

[rule.if]
class = "visual"

[[rule]]
id      = "visual-command"
enabled = true
result  = "deny"
why     = "The machine may never run visual or screenshot tests."

[rule.if]
class           = "exec"
command_matches = '(?i)(headless|--screenshot|screenshot|playwright|puppeteer|capture.{0,12}(image|screen))'

[[rule]]
id      = "human-only-subcommand"
enabled = true
result  = "deny"
why     = "Authorization subcommands run only in the human's own terminal, even when the human asks. Point them at the rule or the config to change instead."

[rule.if]
class    = "exec"
computed = "human_only_call"

[[rule]]
id      = "advance-target"
enabled = true
result  = "deny"
why     = "The agent may not advance to that state. Entering executing is a human act."

[rule.if]
class           = "exec"
command_matches = 'advance\s+(?!asking\b|planning\b|reporting\b|ready\b|blocked\b)[A-Za-z-]+'

[[rule]]
id = "self-authorization-write"
on = "write"
surface = "path"
match = '\.(ps1|psm1|sh|bash|bat|cmd|py|js|rb|pl)$'
when = "enforced"
action = "deny"
only_if = { content_matches = '(?i)ocf\.(py|ps1|sh).{0,300}?(approve|reject|confirm|allow|deny|reload)' }
why = "Writing a human-only subcommand into an executable file is self-authorization."

# The orchestrator's own files. Includes the rules document, because a rules document the machine can
# rewrite is not a rule. `tests/run.py` asserts that this pattern still matches every one of them, so
# moving a file without moving the pattern fails a test instead of opening a hole.
[[rule]]
id = "self-protection-path"
on = "write"
surface = "path"
match = '^\.github/(hooks|ocf|agents|prompts)/|^\.github/work-control-flow\.md$|^\.github/copilot-instructions\.md$|^\.github/protected\.txt$|^\.orchestrator/(state|facts|journal\.log|exec\.log)$'
when = "enforced"
action = "deny"
why = "The orchestrator's own files. The human edits them by hand, or sets system.enabled = false."

[[rule]]
id = "self-protection-write"
on = "exec"
surface = "write_target"
match = '^\.github/(hooks|ocf|agents|prompts)/|^\.github/work-control-flow\.md$|^\.github/copilot-instructions\.md$|^\.github/protected\.txt$|^\.orchestrator/'
when = "enforced"
action = "deny"
why = "A command may not write to the orchestrator's own files."

# The protected list. One rule covers both the editing tools and the terminal, because the condition
# judges the paths the action touches wherever they came from - which is why no "-write" twin is needed.
# There is no exemption to grant: the list is the list.
[[rule]]
id      = "protected-file"
enabled = true
result  = "deny"
why     = "That path is on the protected list. Only the human may change it."

[rule.if]
class             = "write,exec"
touches_protected = true

[[rule]]
id      = "command-too-long"
enabled = true
result  = "deny"
why     = "Command too long. Split it into short single-purpose commands."

[rule.if]
class               = "exec"
command_length_over = 400

[[rule]]
id      = "too-many-statements"
enabled = true
result  = "deny"
why     = "Too many statements chained into one command. Split them and run one at a time."

[rule.if]
class                   = "exec"
command_statements_over = 3

[[rule]]
id      = "silenced-output"
enabled = true
result  = "deny"
why     = "The command silences its output. Everything must stay visible to the human."

[rule.if]
class           = "exec"
command_matches = '(?i)Out-Null|-Quiet|--quiet|>\s*\$null|2>\s*\$null|/dev/null|-WindowStyle\s+Hidden'

[[rule]]
id      = "interactive"
enabled = true
result  = "deny"
why     = "The command may block on input or raise a dialog. Rewrite it non-interactively; anything needing elevation or a click is the human's job."

[rule.if]
class           = "exec"
command_matches = '(?i)Read-Host|ReadKey|-Verb\s+RunAs|(^|[^a-z])sudo\s|cmd(\.exe)?\s+/c'

[[rule]]
id      = "test-authorization"
enabled = true
result  = "deny"
why     = "Do not run tests on your own. Only after the human asks in this conversation, set test_authorized yes."

[rule.if]
class           = "exec"
command_matches = '(?i)(^|[^a-z])(npm|pnpm|yarn|bun)\s+(run\s+)?test|(^|[^a-z])(jest|vitest|mocha|pytest|tox|ctest|rspec)([^a-z]|$)|(^|[^a-z])(dotnet|go|cargo|mvn|mvnw|gradle|gradlew|phpunit)\s+\S*test'
fact            = "test_authorized"
is_not          = "yes"

[[rule]]
id      = "toolchain"
enabled = true
result  = "deny"
why     = "The human has not declared the existing environment. Do not install or probe on your own."

[rule.if]
class           = "exec"
command_matches = '(?i)(^|[^a-z])(npm|pnpm|yarn|bun|pip|pip3|conda|mamba|poetry|uv|gem|composer|cargo|go|dotnet|apt|apt-get|brew|choco|scoop|winget|pacman|npx|dnf|yum)\s+(install|add|get|i|upgrade|update|env|create)|(^|[^a-z])npx\s'
fact            = "stack_env"
is_set          = false

[[rule]]
id      = "destructive"
enabled = true
result  = "deny"
why     = "Destructive command. Hand it to the human."

[rule.if]
class           = "exec"
command_matches = '(?i)rm\s+-rf\s+/[^.]|git\s+push\s+.*--force|drop\s+table|git\s+reset\s+--hard|Remove-Item.*-Recurse.*-Force'

# Approval is evaluated after every specific rule, so a precise reason beats a generic one.
# `approval = true` reads as: approval applies and the state is not an acting state, i.e. exactly the
# case that needs a human approve. It is a condition like any other, so a rule can combine it with a
# class or be excepted by `unless`.
[[rule]]
id      = "env-undeclared"
enabled = true
result  = "deny"
why     = "The human has not declared the existing environment. Say what it is before the machine installs, configures or scaffolds anything; do not probe for it."

[rule.if]
class  = "env"
fact   = "stack_env"
is_set = false

[[rule]]
id      = "approval-required-write"
enabled = true
result  = "require_approval"
why     = "File edits need approval. The human runs the approve subcommand in their own terminal."

[rule.if]
class    = "write"
approval = true

[[rule]]
id      = "approval-required-exec"
enabled = true
result  = "require_approval"
why     = "Commands need approval. The human runs the approve subcommand in their own terminal."

# Reading the orchestrator's own state is not acting: a command that only calls this program is how
# the state gets read at all, so requiring approval for it would make the state unreadable exactly
# while approval is pending.
unless  = { computed = "control_plane" }

[rule.if]
class    = "exec"
approval = true

[[rule]]
id      = "approval-required-env"
enabled = true
result  = "require_approval"
why     = "This tool changes the environment and needs approval."

[rule.if]
class    = "env"
approval = true

[[rule]]
id      = "repeat"
enabled = true
result  = "ask"
why     = "The same command again, which suggests you are stuck in a loop. The human decides whether to continue."

[rule.if]
class                   = "exec"
command_repeats_at_least = 3

# ---------------------------------------------------------------------------
# Soft rules - kind = "soft"
# ---------------------------------------------------------------------------
#
# No hook can enforce these: nothing can check whether a sentence was written. So instead of a verdict
# they carry the sentence itself, and `reload` writes them into the part of
# .github/copilot-instructions.md marked <!-- OCF:GENERATED --> ... <!-- OCF:END -->, which the model
# reads on every turn. Edit the rule here, which is a file the machine may not touch, then run:
#
#     python .github/ocf/ocf.py reload
#
# Field by field, same five as a hard rule:
#   enabled  是否启用    switched off means the sentence is not written out at all
#   kind     规则类型    the rule is soft, so `reload` writes it instead of the gate reading it
#   if       命中情景    occasion = the moment it applies to; one of session-start, ask, plan, act,
#                        answer
#   unless   绕过情景    the exception, in the human's own words: a soft rule is judged by the model,
#                        because no code can evaluate "is this explanation needed here"
#   result   规则逻辑    the sentence that goes in front of the model - prose, not a verdict
#   why      规则描述    the one-line note for whoever reads this file
#
# Order does not matter here: soft rules are never evaluated in sequence, they are grouped by occasion.

[[rule]]
id      = "intake-grilling"
kind    = "soft"
label   = "只问缺的"
enabled = true
why     = "从人类回复和上下文推出规定的8项背景信息"
result  = """
人类的陈述结束后
从人类回复和上下文推出规定的8项背景信息。
只把真的缺的那部分拿去问，一轮问一个问题。
不要猜，也不要替人类填：缺的就是缺的。
敷衍或自动化的回答不算回答，重问。"""
unless  = "人类明确说了「按默认来」「你决定」，这一段的质询就可以跳过。"

[rule.if]
occasion = "ask"

[[rule]]
id      = "independent-audit"
kind    = "soft"
label   = "独立审计"
enabled = true
why     = "审计交给子代理，且 P0 为零时只交报告、不推进状态。"
result  = """
计划写完，派 plan-auditor 子代理做独立审计，
不要自己审自己的计划。
P0 数量为零时，把行动报告和风险设计报告交给人类，
把

    python .github/ocf/ocf.py approve "<reason>"

原样递给他们，然后停下。批准只能由人类在自己的终端里跑出。"""
unless  = "还没有计划可审的时候（例如这一轮只是在澄清需求），不适用。"

[rule.if]
occasion = "plan"

[[rule]]
id      = "no-screenshots"
kind    = "soft"
label   = "截图只能由人类给"
enabled = true
why     = "永久禁用视觉类工具"
result  = """
要看画面时，写清楚要截什么、截几张，然后请人类把截图附上来。
截图是可以读的附件，截图工具是永久禁止的。
不要绕：不要用命令行、无头浏览器或任何其他途径去自己生成图像。"""

[rule.if]
occasion = "act"

[[rule]]
id      = "beginner-mode"
kind    = "soft"
label   = "菜鸟模式"
enabled = true
why     = "讲清原语并沉淀术语表，也在人类说不清时帮他把话理顺"
result  = """
用专业但生动的语言，极尽详细地讲解
你这次回答中出现的每一个领域原语：
它是什么、在这里指什么、为什么这么叫、
和哪个概念容易混淆。
然后把这些原语补进
  .orchestrator/glossary.md；
同一个原语已经记过就不再重复记，
只在定义需要修正时改它。
不要为了讲而讲：
只讲这次回答里真的用到的原语，没用到的不提。

人类的要求、询问、理解模糊、口语化或前后不一致时，
不要猜，也不要反过来让他逐项填表；
以礼貌、谦虚的态度建议他采取三段论的交流格式
目标：一句话说清要什么；
要求：你打算采用的设计步骤与流程；
交付物：目标产物的格式，以及想达到的状态或作用。
并再问一句或再复述一次。"""
unless  = """
人类说「不用解释」「直接给结论」或已明确表示懂了：跳过讲解。
人类已经把目标、要求、交付物说清楚：跳过复述。"""

[rule.if]
occasion = "ask, answer"

[[rule]]
id      = "human-only-commands"
kind    = "soft"
label   = "人类专属命令"
enabled = true
why     = "说清人类专属命令的立场，因为人类在对话里提出要求时，模型的默认倾向是照办。"
result  = """
授权类命令只有允许人类执行。
即使人类在对话里要求你代跑，也不要跑；
他若坚持或强烈要求，告诉他去更改
  .github/ocf/policy.toml
中的对应规则"""
unless  = "从不例外"

[rule.if]
occasion = "act"

[[rule]]
id      = "plan-file"
kind    = "soft"
label   = "写计划文件"
enabled = false
why     = "默认对话不落盘。"
result  = """
把计划模板填充成
  .orchestrator/plan.md：
类型、摘要、步骤、工具、涉及文件、范围、交付物、自检。
每段都要具体到可以直接照着做，
写完再读一遍确认没有猜测。"""
unless  = "人类说「直接给我」「不用写文件」时跳过。"

[rule.if]
occasion = "plan"

[[rule]]
id      = "grill-with-docs"
kind    = "soft"
label   = "对照文档质询"
enabled = true
why     = "质询必须对准项目已有的语言和已定决策"
result  = """
质询或规划之前，先读
  CONTEXT.md
  和
  docs/adr/
：项目已经用什么词、已经定过什么。
问题要对着它们问，比如
「你说的 X 和 CONTEXT.md 里的 Y 是同一个东西吗」
「这个方案和 ADR-0003 的结论冲突，为什么这次不一样」。
术语不一致就先解决术语，再解决问题。"""
unless  = "项目里没有 CONTEXT.md 也没有 docs/adr/ 时，这条没有对照物，跳过。"

[rule.if]
occasion = "plan"
