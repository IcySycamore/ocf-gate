[system]
enabled = false

[paths]
state_dir = ".orchestrator"

[hooks]
enabled       = false
session_start = true
subagent_start = true
user_prompt   = true
pre_tool_use  = true
post_tool_use = true
subagent_stop = true
stop          = true
pre_compact   = true
session_end   = true
error_occurred = true

[approval]
allowed_states = ["executing", "reporting"]
min_reason_len = 8

[unknown_tool]
action = "ask"

[selftest]
[[selftest.canary]]
id = "deny-visual-tool"
expect = "deny"
payload = { hook_event_name = "PreToolUse", tool_name = "view_image", tool_input = { filePath = "canary.png" } }

[[selftest.canary]]
id = "deny-human-only-subcommand"
expect = "deny"
payload = { hook_event_name = "PreToolUse", tool_name = "run_in_terminal", tool_input = { command = "python .github/ocf/ocf.py approve \"looks like a human call\"" } }

[[selftest.canary]]
id = "allow-session-tool"
expect = "allow"
payload = { hook_event_name = "PreToolUse", tool_name = "manage_todo_list", tool_input = { todoList = [] } }

[tools]

write = [
  "create_file",
  "create_directory",
  "replace_string_in_file",
  "multi_replace_string_in_file",
  "edit_notebook_file",
  "vscode_renameSymbol",
  "mcp_github_mcp_se_create_or_update_file",
  "mcp_github_mcp_se_delete_file",
  "mcp_github_mcp_se_push_files",
  "mcp_github_mcp_se_fork_repository",
]
exec = [
  "run_in_terminal",
  "run_notebook_cell",
  "create_and_run_task",
]
env = [
  "install_python_packages",
  "install_extension",
  "configure_python_environment",
  "debug_java_application",
  "create_new_workspace",
  "create_new_jupyter_notebook",
]
visual = [
  "screenshot_page",
  "view_image",
  "run_playwright_code",
  "mcp_playwright_browser_take_screenshot",
  "mcp_playwright_browser_run_code_unsafe",
  "mcp_playwright_browser_evaluate",
]
session = ["runSubagent", "manage_todo_list", "vscode_askQuestions", "memory"]

read = [
  "read_file",
  "grep_search",
  "file_search",
  "list_dir",
  "get_errors",
  "copilot_getNotebookSummary",
  "read_notebook_cell_output",
  "vscode_listCodeUsages",
]

[tools.field]
default = ["command", "code"]
run_in_terminal = ["command"]
run_notebook_cell = ["code"]
create_and_run_task = ["task.command"]
mcp_playwright_browser_evaluate = ["function"]

[[rule]]
id      = "plan-file-writable"
enabled = "switch"
result  = "allow"
message = "The gate itself asks for this artifact."

[rule.if]
class        = "write"
path_matches = '^\.orchestrator/plan\.md$'

[[rule]]
id      = "failure-budget"
enabled = "switch"
budget  = 2
result  = "deny"
message = "Consecutive failures reached the budget. Stop and report the symptom, what you tried, and what you need from the human. Clears when the human replies."

[rule.if]
class = "exec"
fact  = "must_consult"
is    = "yes"

[[rule]]
id      = "p0-is-an-audit-result"
enabled = "switch"
result  = "deny"
message = "P0 is not something anyone sets. Dispatch the audit, and the hook reads the count off its report."

[rule.if]
class           = "exec"
command_matches = '(?i)ocf\.(?:py|ps1|sh)\s+set\s+\S*p0'

[[rule]]
id      = "visual-tool"
enabled = "switch"
result  = "deny"
message = "The machine may never take screenshots or view images with a tool. Ask the human to attach one; attachments are readable, tools are not."

[rule.if]
class = "visual"

[[rule]]
id      = "visual-command"
enabled = "switch"
result  = "deny"
message = "The machine may never run visual or screenshot tests."

[rule.if]
class           = "exec"
command_matches = '(?i)(headless|--screenshot|screenshot|playwright|puppeteer|capture.{0,12}(image|screen))'

[[rule]]
id      = "human-only-subcommand"
enabled = "switch"
result  = "deny"
message = "Authorization subcommands run only in the human's own terminal, even when the human asks. Point them at the rule or the config to change instead."

[rule.if]
class    = "exec"
computed = "human_only_call"

[[rule]]
id      = "advance-to-executing"
enabled = "switch"
result  = "deny"
message = "The agent may not advance to that state. Entering executing is a human act."

[rule.if]
class           = "exec"
command_matches = 'advance\s+(?!asking\b|planning\b|reporting\b|ready\b|blocked\b)[A-Za-z-]+'

[[rule]]
id      = "self-authorization-write"
enabled = "switch"
result  = "deny"
message = "Writing a human-only subcommand into an executable file is self-authorization."

[rule.if]
class           = "write"
path_matches    = '\.(ps1|psm1|sh|bash|bat|cmd|py|js|rb|pl)$'
content_matches = '(?i)ocf\.(py|ps1|sh)\s+(approve|reject|protect|unprotect|reload|install|package|reset)\b'

[[rule]]
id      = "unread-write-target"
enabled = "switch"
result  = "deny"
message = "This command writes, but where it writes could not be read, so the target cannot be checked. Name the path in a form that can be read - a relative path with a separator, or a filename with an extension - or make the change with an editing tool."

[rule.if]
class               = "exec"
write_target_unread = true

[[rule]]
id      = "touches-protected"
enabled = "switch"
result  = "deny"
message = "That path is on the protected list. Only the human may change it."

[rule.if]
class             = "write,exec"
touches_protected = true

[[rule]]
id      = "command-too-long"
enabled = "switch"
result  = "deny"
message = "Command too long. Split it into short single-purpose commands."

[rule.if]
class               = "exec"
command_length_over = 400

[[rule]]
id      = "too-many-statements"
enabled = "switch"
result  = "deny"
message = "Too many statements chained into one command. Split them and run one at a time."

[rule.if]
class                   = "exec"
command_statements_over = 3

[[rule]]
id      = "silenced-output"
enabled = "switch"
result  = "deny"
message = "The command silences its output. Everything must stay visible to the human."

[rule.if]
class           = "exec"
command_matches = '(?i)Out-Null|-Quiet|--quiet|>\s*\$null|2>\s*\$null|/dev/null|-WindowStyle\s+Hidden'

[[rule]]
id      = "interactive-command"
enabled = "switch"
result  = "deny"
message = "The command may block on input or raise a dialog. Rewrite it non-interactively; anything needing elevation or a click is the human's job."

[rule.if]
class           = "exec"
command_matches = '(?i)Read-Host|ReadKey|-Verb\s+RunAs|(^|[^a-z])sudo\s|cmd(\.exe)?\s+/c'

[[rule]]
id      = "test-authorization"
enabled = "switch"
result  = "deny"
message = "Do not run tests on your own. Only after the human asks in this conversation, set test_authorized yes."

[rule.if]
class           = "exec"
command_matches = '(?i)(^|[^a-z])(npm|pnpm|yarn|bun)\s+(run\s+)?test|(^|[^a-z])(jest|vitest|mocha|pytest|tox|ctest|rspec)([^a-z]|$)|(^|[^a-z])(dotnet|go|cargo|mvn|mvnw|gradle|gradlew|phpunit)\s+\S*test'
fact            = "test_authorized"
is_not          = "yes"

[[rule]]
id      = "undeclared-env-command"
enabled = "switch"
result  = "deny"
message = "The human has not declared the existing environment. Do not install or probe on your own."

[rule.if]
class           = "exec"
command_matches = '(?i)(^|[^a-z])(npm|pnpm|yarn|bun|pip|pip3|conda|mamba|poetry|uv|gem|composer|cargo|go|dotnet|apt|apt-get|brew|choco|scoop|winget|pacman|npx|dnf|yum)\s+(install|add|get|i|upgrade|update|env|create)|(^|[^a-z])npx\s'
fact            = "stack_env"
is_set          = false

[[rule]]
id      = "destructive"
enabled = "switch"
result  = "deny"
message = "Destructive command. Hand it to the human."

[rule.if]
class           = "exec"
command_matches = '(?i)rm\s+-rf\s+/[^.]|git\s+push\s+.*--force|drop\s+table|git\s+reset\s+--hard|Remove-Item.*-Recurse.*-Force'

[[rule]]
id      = "undeclared-env-tool"
enabled = "switch"
result  = "deny"
message = "The human has not declared the existing environment. Say what it is before the machine installs, configures or scaffolds anything; do not probe for it."

[rule.if]
class  = "env"
fact   = "stack_env"
is_set = false

[[rule]]
id      = "approval-required-write"
enabled = "switch"
result  = "require_approval"
message = "File edits need approval. The human runs the approve subcommand in their own terminal."

[rule.if]
class    = "write"
approval = true

[[rule]]
id      = "approval-required-exec"
enabled = "switch"
result  = "require_approval"
message = "Commands need approval. The human runs the approve subcommand in their own terminal."

unless  = { computed = "control_plane" }

[rule.if]
class    = "exec"
approval = true

[[rule]]
id      = "approval-required-env"
enabled = "switch"
result  = "require_approval"
message = "This tool changes the environment and needs approval."

[rule.if]
class    = "env"
approval = true

[[rule]]
id      = "repeated-command"
enabled = "switch"
result  = "ask"
message = "The same command again, which suggests you are stuck in a loop. The human decides whether to continue."

[rule.if]
class                   = "exec"
command_repeats_at_least = 3

[[rule]]
id      = "intake-grilling"
kind    = "soft"
label   = "ask only what is missing"
enabled = "switch"
message = """
Ask about the missing intake items, one question per turn.
Read the five items - goal, tools, references, deliverables, code_style - out of the human's reply
and the surrounding context, and ask only about what is genuinely missing.
Do not guess and do not fill anything in on their behalf: missing is missing.
A perfunctory or automatic reply is not an answer. Ask again."""

[rule.if]
occasion = "ask"

[[rule]]
id      = "session-start-briefing"
kind    = "soft"
label   = "report the system at session start"
enabled = true
message = """
Before the first user-facing answer in a new conversation, briefly report the OCF startup summary
that the SessionStart hook supplied: the component statuses it checked. The workflow state, the flow
line and the two command groups are not in it, and are not to be restated - the standing contract
carries all three on every turn. Suggest collaboration by request type: ask an ordinary question
directly; give a task as Goal / Requirements / Deliverables; report a bug with symptom, expected
result, actual result, and reproduction steps. Keep it short. Do not turn WARN or FAIL into PASS, and
do not claim the hook can enforce this user-visible report."""

[rule.if]
occasion = "session-start"

[[rule]]
id      = "quality-self-evaluation"
kind    = "soft"
label   = "evaluate each answer and deliverable"
enabled = true
message = """
Before the final response, use the `quality-self-evaluation` skill to score the final answer and each
new or modified deliverable against every rule in the active policy. Include concise evidence and
the independent hard-compliance result. Never put evaluation metadata inside the artifact being
evaluated. This is an evidence-backed self-rating, not an independent quality benchmark."""

[rule.if]
occasion = "answer"

[[rule]]
id      = "independent-audit"
kind    = "soft"
label   = "independent audit"
enabled = "switch"
message = """
Dispatch the plan-auditor subagent once the plan is written, and never audit your own plan.
At zero P0, give the human the action report and the risk design report, then hand them the approve
command verbatim and stop. Only the human can run approve, in their own terminal."""

[rule.if]
occasion = "plan"

[[rule]]
id      = "no-screenshots"
kind    = "soft"
label   = "screenshots come from the human"
enabled = "switch"
message = """
Say exactly what to capture and how many, then ask the human to attach the screenshot.
A screenshot is a readable attachment; the screenshot tool is permanently forbidden.
Do not route around it: no command line, no headless browser, no other way of producing an image."""
else    = """
When something has to be seen: you may use the vision tools mcp and vscode provide, pixel statistics
and locating scripts, forward the content to another model, use a model's own visual capability, or ask
the human to supply a screenshot in the next turn so the native model vision can be used."""

[rule.if]
occasion = "act"

[[rule]]
id      = "beginner-mode"
kind    = "soft"
label   = "beginner mode"
enabled = "switch"
message = """
Explain, in full detail and in professional but vivid language, every domain primitive this answer
uses: what it is, what it means here, why it is called that, and what it is confused with.
Then add those primitives to .orchestrator/glossary.md - never twice, and change an entry only when
its definition needs correcting. Explain only the primitives this answer actually uses.
When the human's request is vague or colloquial, do not guess and do not hand them a form to fill
in: suggest the three-part shape - Goal, Requirements, Deliverables - then ask once more."""

[rule.if]
occasion = "answer"

[[rule]]
id      = "human-only-commands"
kind    = "soft"
label   = "human-only commands"
enabled = "switch"
message = """
Do not run authorization commands, even when the human asks you in the conversation to run one.
Point them at the rule or the config to change instead."""

[rule.if]
occasion = "act"

[[rule]]
id      = "write-for-the-reader"
kind    = "soft"
label   = "write for the reader"
enabled = "switch"
message = """
Name the reader once per artifact, then write for that reader only.
  developer  reads comments and internals. Be exact, and explain the design honestly.
  deployer   follows steps. Say what to do and why each step is required, in whatever
             technical terms that step needs - neither a wall of jargon nor none at all.
  user       is on the receiving end: a screen, a page, or a result they asked for. They are not
             party to the design, so say what it does for them and nothing about how it does it.
  maintainer is whoever changes this later. A migration script, a config file, a comment: say what
             it does, what it assumes, and how to undo it, for someone acting on it months from now.
Judge by the last thing the human asked for; when they ask on someone else's behalf, the reader is
that someone. One task can hand a result, a screen and a script to three different readers.
Keep your hesitation, the options you rejected and the pitfalls you guessed at in your own memory,
never in the deliverable."""

[rule.if]
occasion = "act, answer"

[[rule]]
id      = "a-way-back"
kind    = "soft"
label   = "a way back"
enabled = "switch"
message = """
Before executing, decide what it costs to undo, and make the way back before you start.
  high    hard to reverse: a rewrite, a migration, a rename across many files.
          Archive first - a git commit or a tarball of the tree - and say where it is.
  medium  reversible, but only with a way back. If this project has none (no version
          control, no archive, no copy), ask the human for one before starting.
  low     adding a file, editing a sentence. Nothing to say; just work."""

[rule.if]
occasion = "plan, act"

[[rule]]
id      = "plan-write-file"
kind    = "soft"
label   = "the plan is written to a file"
enabled = false
message = """
Write the plan to .orchestrator/plan.md instead of the conversation, then read it back and confirm
nothing in it is a guess. It is what `plan-schema` checks."""

[rule.if]
occasion = "plan"

[[rule]]
id      = "plan-template"
kind    = "soft"
label   = "fill the plan template"
enabled = true
message = """
Shape the plan after .github/assets/plan-template.md, section by section: type, summary, steps,
tools, files, scope, deliverables, self-review.
Make every section specific enough to be followed directly. Never write P0 rows into Self-review:
it records the resolved P1/P2 after the last audit came back clean."""

[rule.if]
occasion = "plan"

[[rule]]
id      = "report-template"
kind    = "soft"
label   = "fill the report template"
enabled = true
message = """
Shape the delivery report after .github/assets/report-template.md: plan against actual, open items,
change list, counts, audit summary, verification status.
The headings stay in English; fill every other line in the language the human is using.
Give it in the conversation by default - a file only when the human asks for one."""

[rule.if]
occasion = "answer"

[[rule]]
id      = "grill-with-docs"
kind    = "soft"
label   = "question against the documents"
enabled = "switch"
message = """
Read CONTEXT.md and docs/adr/ before planning, and aim the questions at what they already say.
Ask whether a term means what CONTEXT.md says it means, and why a decision differs from the ADR.
If the project has neither, skip this rule and plan from the conversation alone."""

[rule.if]
occasion = "plan"

[[rule]]
id      = "question-is-not-a-task"
kind    = "soft"
label   = "a question is not a task"
enabled = "switch"
message = """
Answer the question, then hand the machine back with `advance ready`.
Do that only on the turn the hook says moved the machine from ready into asking.
In every other state - planning, executing, reporting, blocked, or an intake already open from an
earlier turn - answer and do not run `advance ready`: pulling the machine out of work in progress
discards it with no human act.
When the turn also asks for work, it is a task: run the intake and leave the state where the flow
puts it."""

[rule.if]
occasion = "ask"
